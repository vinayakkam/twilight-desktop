# Twilight lock screen. Fingerprint (fprintd) and password both unlock;
# the password field always works, so a missing or failing sensor never
# locks you out. No clock here: the time lives only in the top bar.

$font = Inter

general {
    hide_cursor = false
    ignore_empty_input = true
}

# Password + fingerprint options come from the Settings app (Sign-in page).
source = ~/.config/hypr/hyprlock-auth.conf

animations {
    enabled = true
    bezier = ease, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 1.5, ease
    animation = fadeOut, 1, 1.5, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/.local/share/twilight/wallpaper.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    vibrancy = 0.2
}

image {
    monitor =
    path = /var/lib/AccountsService/icons/@USER@
    size = 104
    rounding = -1
    border_size = 3
    border_color = rgba(f2683aee) rgba(f3b651ee) 45deg
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = $DESC
    color = rgba(f1eee6ff)
    font_size = 20
    font_family = $font Semibold
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    rounding = 14
    dots_size = 0.22
    dots_spacing = 0.35
    inner_color = rgba(0d142899)
    outer_color = rgba(f2683acc) rgba(f3b651cc) 45deg
    check_color = rgba(5fd39bee)
    fail_color = rgba(ff6b81ee)
    font_color = rgba(f1eee6ff)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##aeb3c8">Password</span>
    fail_text = $PAMFAIL $FPRINTFAIL
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(aeb3c8ff)
    font_size = 11
    font_family = $font
    position = 0, -96
    halign = center
    valign = center
}
