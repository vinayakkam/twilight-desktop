# Twilight terminal theme ("Launch" palette). Used only inside the Hyprland session
# (KITTY_CONFIG_DIRECTORY points here); kitty in KDE keeps its own config.
font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
scrollback_lines 5000
hide_window_decorations yes

background            #0d1428
foreground            #f1eee6
selection_background  #263a6b
selection_foreground  #ffffff
cursor                #f2683a
url_color             #5eb7d0

# Palette sampled from the rocket-launch wallpaper.
color0  #161d31
color8  #3a4566
color1  #cd4126
color9  #f2683a
color2  #7cc59b
color10 #a3dbb6
color3  #f3b651
color11 #efd99a
color4  #1f5fa3
color12 #5eb7d0
color5  #8a4f86
color13 #b77fb3
color6  #3e9fbf
color14 #8ed1e2
color7  #c9cbd6
color15 #ffffff

# Windows-style clipboard: Ctrl+C copies when text is selected (otherwise it
# stops the running command as usual), Ctrl+V pastes, right-click pastes.
# Ctrl+Shift+C / Ctrl+Shift+V keep working too.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
mouse_map right press ungrabbed paste_from_clipboard
